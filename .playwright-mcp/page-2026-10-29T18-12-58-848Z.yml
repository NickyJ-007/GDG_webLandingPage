                - paragraph [ref=f5e872]: "If you would like to cross-promote your content, just follow these steps:"
                - list [ref=f5e873]:
                  - listitem [ref=f5e874]:
                    - strong [ref=f5e875]: Have some assets hosted here on OGA.
                  - listitem [ref=f5e876]:
                    - strong [ref=f5e877]: Submit some of your assets to one of the platforms listed above.
                    - text: "The assets don't need to be the same as your stuff on OGA, but they must be shared under one of the free licenses accepted on OGA (or be compatible with such licenses): CC0, OGA-BY, CC-BY, CC-BY-SA, WTFPL, Public Domain, et cetera. This doesn't mean"
                    - emphasis [ref=f5e878]: all
                    - text: of your content on those platforms must be under a free and open license, but the ones featuring a banner (below) must be.
                  - listitem [ref=f5e879]:
                    - strong [ref=f5e880]: Display one of the banner images below and link back to Opengameart.org
                    - text: . When submitting assets to one of the above platforms, add a link to OGA's main page (https://opengameart.org), your OGA profile page, or one of your OGA submission pages. Display one of the banner images below as one of the media previews or in the asset page's description.
                  - listitem [ref=f5e881]:
                    - strong [ref=f5e882]: Let us know!
                    - text: Post a comment below linking to your asset on the other platform(s). We'll add your information above and promote you here!
                - paragraph [ref=f5e883]:
                  - link [ref=f5e884] [cursor=pointer]:
                    - /url: https://opengameart.org/sites/default/files/archive/ogabacklinkinggodotassetstorev2.png
                    - img "Godot Asset Store banner" [ref=f5e885]
                  - link [ref=f5e886] [cursor=pointer]:
                    - /url: https://opengameart.org/sites/default/files/archive/ogabacklinkingitchiov2.png
                    - img "itch.io banner" [ref=f5e887]
                - paragraph [ref=f5e888]:
                  - generic [ref=f5e889]: "NOTE: Due to the Terms-of-Use on these other platforms, you should only share assets where you have explicit permission from all contributing artists. If you plan to share assets derived from prior free works, you should obtain permission from the authors of all works that your asset was derived from before sharing it on the above platforms. If you are the sole author of your assets, no problem! Just give yourself permission to share your work! :D NOTE: OGA has no official affiliation or promotion with these platforms. Although we wouldn't mind that, this is just a friendly attempt to give well-deserved attention to some of our favorite artists and platforms."
